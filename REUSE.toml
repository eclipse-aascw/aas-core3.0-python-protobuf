version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on PyPI, the documentation) or which can not carry
# a comment.
[[annotations]]
path = [
    "AUTHORS",
    "README.md",
    "docs/**/*.rst",
    "docs/**/*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-python-protobuf AUTHORS"
SPDX-License-Identifier = "MIT"

# The snippets are inserted verbatim into the generated code by aas-core-codegen,
# so they must not carry a header of their own.
[[annotations]]
path = "dev_scripts/snippets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-python-protobuf AUTHORS"
SPDX-License-Identifier = "MIT"

# The test data is generated by aas-core3.0-testgen and copied over as-is
# on every change, so it must not carry a header of its own.
[[annotations]]
path = "test_data/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-python-protobuf AUTHORS"
SPDX-License-Identifier = "MIT"

# The code generated from the meta-model transcribes the AAS
# specification: the doc comments derived from its docstrings quote
# the definitions of the classes, attributes and constraints. That text keeps
# the license of the specification, next to the MIT license of our own code.
# The specifications published by IDTA are licensed under CC BY 4.0.
[[annotations]]
path = "dev_scripts/proto/types.proto"
precedence = "aggregate"
SPDX-FileCopyrightText = "Industrial Digital Twin Association e. V."
SPDX-License-Identifier = "CC-BY-4.0"
