version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on PyPI, the documentation) or which can not carry
# a comment.
[[annotations]]
path = [
    "AUTHORS",
    "README.md",
    "docs/**/*.rst",
    "docs/**/*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-python-protobuf AUTHORS"
SPDX-License-Identifier = "MIT"

# The snippets are inserted verbatim into the generated code by aas-core-codegen,
# so they must not carry a header of their own.
[[annotations]]
path = "dev_scripts/snippets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-python-protobuf AUTHORS"
SPDX-License-Identifier = "MIT"

# The test data is generated by aas-core3.0-testgen and copied over as-is
# on every change, so it must not carry a header of its own.
[[annotations]]
path = "test_data/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-python-protobuf AUTHORS"
SPDX-License-Identifier = "MIT"
